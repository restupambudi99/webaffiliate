name: Website checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run seed:build
      - run: npm run seed:validate
      - run: node scripts/test-safety.mjs
      - run: node scripts/test-cms-policy.mjs
      - run: npm run check
      - run: npm run build
